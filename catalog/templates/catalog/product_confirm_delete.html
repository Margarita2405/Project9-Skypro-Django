{% extends 'catalog/base.html' %}

{% block content %}
{% include 'catalog/includes/header.html' %}
<div class="container mt-4">
    <h2>Удаление товара</h2>
    <p>Вы уверены, что хотите удалить товар <strong>{{ product.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
