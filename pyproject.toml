[project]
name = "project9-skypro-django"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0.4,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.black]
target-version = ['py313']
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119
[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
flake8 = "^7.3.0"
[tool.poetry.group.lint.dependencies]
mypy = "^1.20.1"
black = "^26.3.1"
isort = "^8.0.1"

